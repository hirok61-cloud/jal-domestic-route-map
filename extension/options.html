<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>JAL空席コレクタの設定</title>
<style>
:root{color-scheme:light dark;
  --red:#b7001e; --ink:#1b1e24; --sub:#6b7480; --bg:#faf9f7; --panel:#fff; --edge:#e2e0da; --ok:#1a7f4b;}
@media (prefers-color-scheme:dark){:root{
  --red:#ff4256; --ink:#eceff3; --sub:#95a1ad; --bg:#0e1216; --panel:#141a21; --edge:#27303a; --ok:#5ed58f;}}
*{box-sizing:border-box}
body{margin:0;padding:18px;width:400px;background:var(--bg);color:var(--ink);
  font:13px/1.7 "Hiragino Sans","Yu Gothic UI",-apple-system,sans-serif}
h1{margin:0 0 2px;font-size:15px;letter-spacing:.04em}
.sub{color:var(--sub);font-size:11.5px;margin-bottom:14px}
label{display:block;font-size:11px;letter-spacing:.14em;color:var(--sub);font-weight:700;margin-bottom:4px}
input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--edge);
  background:var(--panel);color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12.5px;outline:none}
input:focus{border-color:var(--red)}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
button{border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.state{font-size:12px;margin-top:8px}
.ok{color:var(--ok);font-weight:700}
.warn{color:var(--red);font-weight:700}
h2{margin:18px 0 6px;font-size:12px;letter-spacing:.1em;color:var(--sub)}
pre{margin:0;padding:10px;border:1px solid var(--edge);background:var(--panel);border-radius:9px;
  max-height:190px;overflow:auto;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.note{color:var(--sub);font-size:11.5px;margin-top:12px}
</style>
</head>
<body>
<h1>JAL空席コレクタ</h1>
<div class="sub">「空席状況」を裏で収集して更新します。</div>

<label for="key">合言葉</label>
<input id="key" type="text" placeholder="合言葉を貼り付け" autocomplete="off" spellcheck="false">
<div class="state" id="state"></div>

<div class="row">
  <button class="primary" id="run">いますぐ更新</button>
  <button id="clear">ログを消す</button>
</div>
<div class="note">
  更新には約2分かかります。JALのページが別ウィンドウで開き、終わると自動的に閉じます。
  <b>その間ウィンドウを閉じたり最小化したりしないでください。</b>
</div>

<h2>実行ログ</h2>
<pre id="log">まだ実行していません。</pre>

<script src="options.js"></script>
</body>
</html>
