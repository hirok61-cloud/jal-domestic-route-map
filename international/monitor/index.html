<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<title>HND⇔GMP 空席モニター</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="羽田⇔金浦線(JL/NH/OZ/KE 直行便)のエコノミー空席とスタンバイ状況を毎日モニターする非公式ツール">
<style>
:root{
  color-scheme: light dark;
  --red:#b7001e; --red-deep:#8c0017; --red-soft:#fbeef0; --gold:#a98e5e;
  --bg:#faf9f7; --sea:#e7edf2; --land:#f3f0ea; --coast:#c6d2da;
  --ink:#1b1e24; --sub:#6b7480; --panel:#ffffff; --panel-edge:#e2e0da; --hair:#eceae5; --chipbg:#f4f2ee;
  --hover:#0d55a0;
  --c-JAL:#c8102e; --c-NH:#2f6db5; --c-OZ:#c9822d; --c-KE:#1f9ec4;
  --ok:#0e7c2f; --ok-bg:#c5efd0; --warn:#845400; --warn-bg:#ffe294; --bad:#c01f12; --bad-bg:#ffcfc7;
  --shadow:0 10px 30px rgba(30,20,20,.12); --card-shadow:0 2px 10px rgba(30,20,20,.06);
}
@media (prefers-color-scheme: dark){:root{
  --red:#ff4256; --red-deep:#c2182e; --red-soft:#39141a; --gold:#d7bc85;
  --bg:#0e1216; --sea:#0a1218; --land:#1b242d; --coast:#2c3b47;
  --ink:#eceff3; --sub:#95a1ad; --panel:#141a21; --panel-edge:#27303a; --hair:#20272f; --chipbg:#1b222b;
  --hover:#5ab0ff;
  --c-JAL:#ff4d5e; --c-NH:#5b8fe6; --c-OZ:#e2a84f; --c-KE:#4cc3e8;
  --ok:#63e58c; --ok-bg:#124a28; --warn:#ffd056; --warn-bg:#4d3d0a; --bad:#ff8a80; --bad-bg:#5e1a17;
  --shadow:0 10px 30px rgba(0,0,0,.55); --card-shadow:0 2px 10px rgba(0,0,0,.4);
}}
:root[data-theme="light"]{
  color-scheme: light;
  --red:#b7001e; --red-deep:#8c0017; --red-soft:#fbeef0; --gold:#a98e5e;
  --bg:#faf9f7; --sea:#e7edf2; --land:#f3f0ea; --coast:#c6d2da;
  --ink:#1b1e24; --sub:#6b7480; --panel:#ffffff; --panel-edge:#e2e0da; --hair:#eceae5; --chipbg:#f4f2ee;
  --hover:#0d55a0;
  --c-JAL:#c8102e; --c-NH:#2f6db5; --c-OZ:#c9822d; --c-KE:#1f9ec4;
  --ok:#0e7c2f; --ok-bg:#c5efd0; --warn:#845400; --warn-bg:#ffe294; --bad:#c01f12; --bad-bg:#ffcfc7;
  --shadow:0 10px 30px rgba(30,20,20,.12); --card-shadow:0 2px 10px rgba(30,20,20,.06);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --red:#ff4256; --red-deep:#c2182e; --red-soft:#39141a; --gold:#d7bc85;
  --bg:#0e1216; --sea:#0a1218; --land:#1b242d; --coast:#2c3b47;
  --ink:#eceff3; --sub:#95a1ad; --panel:#141a21; --panel-edge:#27303a; --hair:#20272f; --chipbg:#1b222b;
  --hover:#5ab0ff;
  --c-JAL:#ff4d5e; --c-NH:#5b8fe6; --c-OZ:#e2a84f; --c-KE:#4cc3e8;
  --ok:#63e58c; --ok-bg:#124a28; --warn:#ffd056; --warn-bg:#4d3d0a; --bad:#ff8a80; --bad-bg:#5e1a17;
  --shadow:0 10px 30px rgba(0,0,0,.55); --card-shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;
  font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
/* ---------- ヘッダー(サイト共通) ---------- */
.brandline{height:4px;background:linear-gradient(90deg,var(--red-deep),var(--red) 30%,var(--red) 70%,var(--red-deep))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;
  padding:16px 22px 12px;border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,var(--panel),var(--bg))}
.crest{width:44px;height:44px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%, var(--red) 0%, var(--red-deep) 90%);
  box-shadow:0 4px 14px color-mix(in srgb,var(--red) 45%,transparent);
  display:flex;align-items:center;justify-content:center}
.crest span{color:#fff;font-size:21px;transform:rotate(-45deg) translate(1px,1px)}
.titlebox{min-width:0}
.eyebrow{font-size:10px;letter-spacing:.32em;color:var(--red);font-weight:700;line-height:1.4}
.titlebox h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:22px;font-weight:600;letter-spacing:.06em;line-height:1.25}
.titlebox h1 .jp-red{color:var(--red)}
.dateline{color:var(--sub);font-size:11px;letter-spacing:.06em}
.navtabs{display:flex;gap:0;margin-left:auto;align-items:center}
.navtab{font-size:12px;font-weight:700;letter-spacing:.05em;text-decoration:none;color:var(--sub);
  padding:7px 15px;border:1px solid var(--panel-edge);background:var(--panel);transition:all .15s;white-space:nowrap}
.navtab:first-child{border-radius:999px 0 0 999px;border-right:none}
.navtab:last-child{border-radius:0 999px 999px 0}
.navtab.active{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border-color:var(--red)}
.navtab:not(.active):hover{color:var(--red);border-color:var(--red)}
.stats{display:flex;gap:8px;margin-left:14px}
.stat{background:var(--panel);border:1px solid var(--panel-edge);border-radius:12px;
  padding:5px 13px;text-align:center;line-height:1.25;box-shadow:var(--card-shadow)}
.stat b{display:block;font-size:16px;color:var(--red);font-variant-numeric:tabular-nums}
.stat span{font-size:9px;color:var(--sub);letter-spacing:.12em}
#sharebtn{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border-radius:999px;
  padding:9px 16px;font-size:12.5px;font-weight:700;letter-spacing:.06em;margin-left:12px;
  box-shadow:0 4px 14px color-mix(in srgb,var(--red) 40%,transparent);transition:transform .15s,box-shadow .15s}
#sharebtn:hover{transform:translateY(-1px);box-shadow:0 6px 18px color-mix(in srgb,var(--red) 50%,transparent)}
.subtabs{display:flex;gap:22px;padding:0 22px;border-bottom:1px solid var(--hair);background:var(--bg)}
.subtab{position:relative;text-decoration:none;color:var(--sub);font-size:13px;font-weight:700;
  letter-spacing:.06em;padding:11px 2px 10px;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s}
.subtab:hover{color:var(--red)}
.subtab.active{color:var(--red);border-bottom-color:var(--red)}
/* ---------- 操作バー ---------- */
.opbar{display:flex;align-items:center;gap:10px;padding:9px 22px;border-bottom:1px solid var(--hair);
  overflow-x:auto;scrollbar-width:thin;background:var(--bg)}
.opbar .lbl{font-size:10px;color:var(--sub);letter-spacing:.2em;white-space:nowrap;flex:none;font-weight:600}
.dirseg{display:flex;flex:none}
.dirbtn{border:1px solid var(--panel-edge);background:var(--panel);cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 16px;white-space:nowrap;
  transition:all .15s;box-shadow:var(--card-shadow)}
.dirbtn:first-child{border-radius:999px 0 0 999px;border-right:none}
.dirbtn:last-child{border-radius:0 999px 999px 0}
.dirbtn.on{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border-color:var(--red)}
.dirbtn:not(.on):hover{color:var(--red);border-color:var(--red)}
.ally{display:flex;gap:6px;flex:none}
.ally-pill{--oc:#888;display:inline-flex;align-items:center;gap:7px;flex:none;
  border:1px solid var(--panel-edge);background:var(--panel);border-radius:999px;
  padding:5px 14px 5px 10px;cursor:pointer;transition:all .18s;box-shadow:var(--card-shadow)}
.ally-pill .sw{width:11px;height:11px;border-radius:3px;background:var(--oc);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--oc) 20%, transparent)}
.ally-pill .nm{font-weight:700;font-size:12px;letter-spacing:.02em}
.ally-pill .ct{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.ally-pill:hover{border-color:var(--oc);transform:translateY(-1px)}
.ally-pill.off{opacity:.35;filter:saturate(.15);box-shadow:none;transform:none}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);flex:none}
.lg .dot{width:17px;height:17px;border-radius:5px;flex:none;border:1px solid var(--hair);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1}
/* 横スクロール中も右端に貼り付いて常に見えるように(スマホ対策) */
.updbtn{margin-left:auto;flex:none;text-decoration:none;font-size:12px;font-weight:700;color:var(--red);
  border:1px solid var(--panel-edge);background:var(--panel);border-radius:999px;padding:5px 13px;
  position:sticky;right:0;z-index:2;
  box-shadow:-10px 0 10px -6px rgba(0,0,0,.22),var(--card-shadow);white-space:nowrap;transition:all .15s}
.updbtn:hover{border-color:var(--red);transform:translateY(-1px)}
/* ---------- 本文 ---------- */
main{max-width:1240px;margin:0 auto;padding:20px 22px 60px}
.sec{margin:30px 0 12px;font-size:10.5px;color:var(--sub);letter-spacing:.22em;font-weight:700;
  display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:14px;height:3px;background:var(--red);border-radius:2px}
.note{margin:10px 0;padding:9px 13px;border-left:3px solid var(--red);background:var(--chipbg);
  border-radius:0 10px 10px 0;font-size:12px}
.hint{color:var(--sub);font-size:11.5px;margin-top:8px;line-height:1.8}
/* 搭乗券風ヘッダー */
.bp{border:1px solid var(--panel-edge);border-radius:14px;overflow:hidden;background:var(--panel);
  box-shadow:var(--card-shadow);margin:16px 0 6px}
.bp-band{background:linear-gradient(90deg,var(--red),var(--red-deep));color:#fff;
  display:flex;justify-content:space-between;gap:8px;padding:5px 14px;
  font-size:9.5px;letter-spacing:.18em;font-weight:700}
.bp-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:13px 16px 11px;gap:6px}
.bp-ap b{display:block;font-size:27px;line-height:1.1;font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.03em}
.bp-ap span{font-size:11px;color:var(--sub)}
.bp-ap.right{text-align:right}
.bp-mid{text-align:center;color:var(--sub);font-size:10.5px;line-height:1.5;padding:0 6px}
.bp-mid .plane{display:block;color:var(--red);font-size:16px}
/* ヒートマップ */
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;
  padding:14px 16px;box-shadow:var(--card-shadow)}
.tablewrap{overflow-x:auto}
/* ①ヒートマップ: ヘッダ行(便名)と日付列を固定し、縦横スクロール中も便名が常に見えるように */
.heatwrap{overflow:auto;max-height:72vh;border-radius:12px}
.heat thead th{position:sticky;top:0;z-index:2;background:var(--panel);box-shadow:inset 0 -2px 0 var(--red)}
.heat thead th.corner{left:0;z-index:3}
table{border-collapse:collapse;font-size:12px}
th{font-size:9.5px;color:var(--sub);text-align:center;font-weight:600;letter-spacing:.04em;
  padding:4px 6px;border-bottom:2px solid var(--red);white-space:nowrap}
th .fno{display:block;font-size:11px;color:var(--ink);font-weight:700;letter-spacing:0}
td{padding:0;border-bottom:1px solid var(--hair);white-space:nowrap;text-align:center;vertical-align:middle}
td.dt{padding:4px 9px;text-align:left;font-weight:700;font-size:11.5px;position:sticky;left:0;background:var(--panel);z-index:1}
td.dt .wd{font-weight:600;font-size:10px;margin-left:3px;color:var(--sub)}
td.dt .wd.sat{color:var(--hover)} td.dt .wd.sun{color:var(--red)}
.cell{display:block;min-width:52px;padding:4px 6px 3px;line-height:1.25;cursor:default}
.cell .y{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:13px}
.cell .sb{display:block;font-size:9px;letter-spacing:.02em}
.cell.j0{background:var(--ok-bg)} .cell.j0 .y{color:var(--ok)}
.cell.j1{background:var(--warn-bg)} .cell.j1 .y{color:var(--warn)}
.cell.j2{background:var(--bad-bg)} .cell.j2 .y{color:var(--bad)}
.cell .sb{color:var(--sub)} .cell .sb.hot{color:var(--bad);font-weight:700}
.opdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:baseline;background:var(--oc,#888)}
/* エアラインバッジ: ブランドカラー地に白抜き2レターコード。便名の前に置いて一目で会社が分かるように */
.ab{display:inline-block;background:var(--oc,#888);color:#fff;font-size:9px;font-weight:800;
  border-radius:5px;padding:1px 5px;line-height:1.5;letter-spacing:.04em;vertical-align:1px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  box-shadow:0 1px 3px color-mix(in srgb,var(--oc,#888) 40%,transparent)}
/* SBチャート */
.chart{display:block}
.chart text{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.chart .axis{stroke:var(--hair)} .chart .tick{fill:var(--sub);font-size:11px}
.chart .val{font-size:12.5px;font-weight:800;paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.chartlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;margin-top:6px}
.chartlegend .it{display:inline-flex;align-items:center;gap:6px}
.chartlegend .sw{width:14px;height:3px;border-radius:2px}
/* 判定カレンダー */
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(66px,1fr));gap:5px;min-width:510px}
.calhead{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding:2px 0}
.calhead.sun{color:var(--red)} .calhead.sat{color:var(--hover)}
.cday{border:1px solid var(--panel-edge);border-radius:11px;background:var(--panel);
  min-height:78px;padding:5px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:0;
  box-shadow:var(--card-shadow);cursor:pointer;position:relative;transition:transform .1s}
.cday[data-d]:hover{transform:translateY(-1px)}
.cday.watched{box-shadow:0 0 0 2px var(--gold), var(--card-shadow)}
.cday.blank{visibility:hidden}
.cday.j0{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.cday.j1{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.cday.j2{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.cday .cd{align-self:flex-start;font-size:10.5px;font-weight:700;line-height:1.2}
.cday .sym{font-size:26px;font-weight:800;line-height:1.15}
.cday.j0 .sym{color:var(--ok)} .cday.j1 .sym{color:var(--warn)} .cday.j2 .sym{color:var(--bad)}
.cday .bf{font-size:9.5px;color:var(--sub);line-height:1.35;text-align:center;white-space:nowrap}
.cday .bf b{color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700}
.cday .cd .wd{margin-left:4px;font-weight:600}
/* 推移 */
select{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--panel-edge);
  background:var(--panel);color:var(--ink);font-family:inherit;box-shadow:var(--card-shadow)}
#trendwrap table td{padding:0}
#trendwrap td.dt{font-size:11px}
#trendwrap .fnl{font-weight:700}
#trendwrap .tdep{color:var(--sub);font-weight:600;margin-left:5px;font-size:10.5px}
#trendwrap th.snap{padding:3px 8px;line-height:1.2}
#trendwrap th.snap .sd{display:block;font-size:9px;letter-spacing:.02em}
#trendwrap th.snap .sh{display:block;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
#trendwrap th.snap-today{color:var(--ink)}
#trendwrap th.snap-today .sh{color:var(--red)}
#trendwrap th.snap-past{color:var(--sub)}
#trendwrap th.snap-past .sh{font-weight:600}
/* ④のセルは角丸チップに統一(変化なし便も同じ見た目のチップ+ピルで揃える) */
#trendwrap td{border-bottom:1px solid var(--hair)}
#trendwrap .cell{border-radius:8px;min-width:56px;margin:3px 2px;padding:4px 7px 3px}
#trendwrap .cell.chg{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 26%,transparent)}
#trendwrap .d-up{color:var(--bad);font-size:8px;margin-left:1px;vertical-align:1px}
#trendwrap .d-dn{color:var(--ok);font-size:8px;margin-left:1px;vertical-align:1px}
#trendwrap td.ncwrap{padding:0 4px}
#trendwrap .ncin{display:inline-flex;align-items:center;gap:8px}
#trendwrap .cell.nc{opacity:.45;margin-right:0}
.ncpill{font-size:9.5px;color:var(--sub);border:1px solid var(--panel-edge);background:var(--chipbg);
  border-radius:999px;padding:1px 9px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.trendmore{color:var(--sub);font-size:11px;margin:0 0 7px;letter-spacing:.02em}
/* 判定基準の折りたたみ説明(タップで開く) */
details.judgedef{margin-top:9px}
details.judgedef summary{cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  color:var(--red);font-size:12px;font-weight:700;letter-spacing:.03em;list-style:none;
  border:1px solid var(--panel-edge);background:var(--panel);border-radius:999px;padding:4px 13px;
  box-shadow:var(--card-shadow);user-select:none}
details.judgedef summary::-webkit-details-marker{display:none}
details.judgedef summary::before{content:"▸";font-size:10px;transition:transform .15s}
details.judgedef[open] summary::before{transform:rotate(90deg)}
details.judgedef .jd{margin-top:9px;font-size:12px;color:var(--sub);line-height:2;
  background:var(--chipbg);border-radius:10px;padding:10px 13px}
details.judgedef .jd b{color:var(--ink)}
details.judgedef .jd .row{display:flex;gap:8px;align-items:baseline}
details.judgedef .jd .row .pill{flex:none;min-width:3.4em;text-align:center}
/* 収集の健康状態バー(国内線の空席機能と同じ考え方): 普段は目立たず、
   更新が止まっている時だけ警告色にする。「● 収集 07:38 成功」のような一目表示。 */
.healthbar{margin:0;padding:8px 22px;font-size:11.5px;
  display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;line-height:1.65;
  border-bottom:1px solid var(--hair)}
.healthbar.ok{background:var(--chipbg);color:var(--sub)}
.healthbar.warn{background:var(--warn-bg);color:var(--warn)}
.healthbar .hdot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px}
.healthbar.ok .hdot{background:var(--ok)}
.healthbar.warn .hdot{background:var(--warn)}
.healthbar .hitem{white-space:nowrap;min-width:0}
.healthbar .hsub{color:var(--sub);margin:0 2px}
.healthbar.warn .hsub{color:color-mix(in srgb,var(--warn) 70%,var(--sub))}
/* 祝日バッジ */
.hd{display:inline-block;font-size:8px;font-weight:800;border-radius:4px;padding:0 3px;margin-left:3px;
  vertical-align:1px;line-height:1.5;letter-spacing:0}
.hd.jp{color:var(--red);border:1px solid color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.hd.kr{color:var(--hover);border:1px solid color-mix(in srgb,var(--hover) 55%,transparent);background:color-mix(in srgb,var(--hover) 10%,transparent)}
/* C8: 本日これから */
.todaycard{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0 2px;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:10px 14px;box-shadow:var(--card-shadow)}
.tdlbl{font-size:12px;font-weight:800;color:var(--red);letter-spacing:.06em;flex:none}
.tchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.tchip .tv{font-weight:600;font-size:11px;opacity:.85}

/* 便選択ピッカー(日付タップで開く) */

.dpk-row .sy{font-weight:800;width:18px;text-align:center;flex:none}
.dpk-row .sy.s0{color:var(--ok)} .dpk-row .sy.s1{color:var(--warn)} .dpk-row .sy.s2{color:var(--bad)}

/* ⑥リードタイム 便切替 / ③時間帯フィルタ(共通見た目) */

<script>
"use strict";
const AL = {JL:{name:"JAL", c:"var(--c-JAL)"}, NH:{name:"ANA", c:"var(--c-NH)"}, OZ:{name:"アシアナ", c:"var(--c-OZ)"}, KE:{name:"大韓航空", c:"var(--c-KE)"}};
const alBadge = code => `<span class="ab" style="--oc:${(AL[code]||{}).c||"#888"}">${code}</span>`;
const WD = "日月火水木金土";

// 収集の健康状態バー(国内線の空席機能と同じ考え方): 「● 収集 07:38 成功」のような一目表示。
// 普段は目立たせず、更新が止まっている(15時間超)ときだけ警告色にする。
function whenLabel(ts){
  const d = new Date(ts);
  const sameDay = d.toDateString() === new Date().toDateString();
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return sameDay ? hm : `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function renderHealth(j){
  const box = document.getElementById("healthbar");
  if (!j.latest) { box.hidden = true; return; }
  const ts = new Date(j.latest.ts);
  const ageH = (Date.now() - ts.getTime()) / 36e5;
  const dk = (dt) => dt.getFullYear() + "-" + dt.getMonth() + "-" + dt.getDate();
  const todayCount = j.snapshots.filter(s => dk(new Date(s.ts)) === dk(new Date())).length;
  const warn = ageH >= 15;
  box.className = "healthbar " + (warn ? "warn" : "ok");
  let html = `<span class="hdot"></span><span class="hitem">収集 <b>${whenLabel(j.latest.ts)}</b> ${warn ? "更新なし" : "成功"}</span>`;
  html += `<span class="hsub">・</span><span class="hitem">本日${todayCount}回目</span>`;
  if (warn) html += `<span class="hsub">・</span><span class="hitem">約${Math.round(ageH)}時間経過。myIDTravelにログインして収集ボタンを押してください</span>`;
  box.innerHTML = html;
  box.hidden = false;
}

let DATA = null;
let dir = "HND-GMP";
// 航空会社フィルタ: NH・OZはデフォルトOFF(気になる時にタップでON)。変更は端末に記憶する
const alOn = {JL:true, NH:false, OZ:false, KE:true};
try {
  const saved = JSON.parse(localStorage.getItem("hndgmpAlOn") || "null");
  if (saved && typeof saved === "object") for (const k of Object.keys(alOn)) if (typeof saved[k] === "boolean") alOn[k] = saved[k];
  // 既存端末には旧デフォルト(OZ:ON)が保存済みなので、OZをOFFにする変更を1回だけ適用する
  if (localStorage.getItem("hndgmpAlOnV") !== "2"){
    if (saved) { alOn.OZ = false; localStorage.setItem("hndgmpAlOn", JSON.stringify(alOn)); }
    localStorage.setItem("hndgmpAlOnV", "2");
  }
} catch (e) {}
function saveAlOn(){ try { localStorage.setItem("hndgmpAlOn", JSON.stringify(alOn)); } catch (e) {} }

// ③時間帯フィルタ: 方向ごとに「全便/午前/午後/夕方」を記憶する
// (HND→GMPは朝便・GMP→HNDは夕方便に乗る、のような使い分けを想定。境界は12:00と17:00)
const TODS = {am: ["午前", "〜12時", t => t < "12:00"],
              pm: ["午後", "12〜17時", t => t >= "12:00" && t < "17:00"],
              eve: ["夕方", "17時〜", t => t >= "17:00"]};
const tod = {"HND-GMP": "all", "GMP-HND": "all"};
try {
  const savedTod = JSON.parse(localStorage.getItem("hndgmpTod") || "null");
  if (savedTod && typeof savedTod === "object")
    for (const k of Object.keys(tod)) if (savedTod[k] === "all" || TODS[savedTod[k]]) tod[k] = savedTod[k];
} catch (e) {}
function saveTod(){ try { localStorage.setItem("hndgmpTod", JSON.stringify(tod)); } catch (e) {} }
function inTod(f){ const m = tod[dir]; return m === "all" || TODS[m][2](f.dep); }
const todLabel = () => TODS[tod[dir]] ? TODS[tod[dir]][0] + "便" : "";

// 日韓の祝日(2026-08〜2027-12)。カレンダー/ヒートマップに小バッジ表示
// ※旧暦連動(ソルラル・釈迦誕生日・秋夕)は毎年変わるので年1回ここを更新すること
const HOLIDAYS = {
  "2026-09-21": {jp: "敬老の日"},
  "2026-09-22": {jp: "国民の休日"},
  "2026-09-23": {jp: "秋分の日"},
  "2026-10-12": {jp: "スポーツの日"},
  "2026-11-03": {jp: "文化の日"},
  "2026-11-23": {jp: "勤労感謝の日"},
  "2026-09-24": {kr: "秋夕(連休)"},
  "2026-09-25": {kr: "秋夕"},
  "2026-09-26": {kr: "秋夕(連休)"},
  "2026-10-03": {kr: "開天節"},
  "2026-10-05": {kr: "開天節 振替休日"},
  "2026-10-09": {kr: "ハングルの日"},
  "2026-12-25": {kr: "クリスマス"},
  "2027-01-01": {jp: "元日", kr: "新正月"},
  "2027-01-11": {jp: "成人の日"},
  "2027-02-06": {kr: "ソルラル(連休)"},
  "2027-02-07": {kr: "ソルラル(旧正月)"},
  "2027-02-08": {kr: "ソルラル(連休)"},
  "2027-02-09": {kr: "ソルラル 振替休日"},
  "2027-02-11": {jp: "建国記念の日"},
  "2027-02-23": {jp: "天皇誕生日"},
  "2027-03-01": {kr: "三一節"},
  "2027-03-21": {jp: "春分の日"},
  "2027-03-22": {jp: "振替休日"},
  "2027-04-29": {jp: "昭和の日"},
  "2027-05-03": {jp: "憲法記念日"},
  "2027-05-04": {jp: "みどりの日"},
  "2027-05-05": {jp: "こどもの日", kr: "こどもの日"},
  "2027-05-13": {kr: "釈迦誕生日"},
  "2027-06-06": {kr: "顕忠日"},
  "2027-07-19": {jp: "海の日"},
  "2027-08-11": {jp: "山の日"},
  "2027-08-15": {kr: "光復節"},
  "2027-08-16": {kr: "光復節 振替休日"},
  "2027-09-14": {kr: "秋夕(連休)"},
  "2027-09-15": {kr: "秋夕"},
  "2027-09-16": {kr: "秋夕(連休)"},
  "2027-09-20": {jp: "敬老の日"},
  "2027-09-23": {jp: "秋分の日"},
  "2027-10-03": {kr: "開天節"},
  "2027-10-04": {kr: "開天節 振替休日"},
  "2027-10-09": {kr: "ハングルの日"},
  "2027-10-11": {jp: "スポーツの日", kr: "ハングルの日 振替休日"},
  "2027-11-03": {jp: "文化の日"},
  "2027-11-23": {jp: "勤労感謝の日"},
  "2027-12-25": {kr: "クリスマス"},
};
function holidayBadge(iso){
  const h = HOLIDAYS[iso];
  if (!h) return "";
  let s = "";
  if (h.jp) s += `<span class="hd jp" title="日本: ${h.jp}">日</span>`;
  if (h.kr) s += `<span class="hd kr" title="韓国: ${h.kr}">韓</span>`;
  return s;
}
function holidayTip(iso){
  const h = HOLIDAYS[iso];
  if (!h) return "";
  const parts = [];
  if (h.jp) parts.push("日本:" + h.jp);
  if (h.kr) parts.push("韓国:" + h.kr);
  return " ／ 祝日 " + parts.join("・");
}

// ウォッチ(この日に乗る): localStorageに{d,dir}の配列。過去日は自動削除
let WATCH = [];
try { WATCH = JSON.parse(localStorage.getItem("hndgmpWatch") || "[]"); } catch (e) { WATCH = []; }
function todayIso(){
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
}
// 便単位のウォッチ({d, dir, fn})。旧形式(便なし)と過去日は捨てる
WATCH = WATCH.filter(w => w && w.d >= todayIso() && w.fn);
function saveWatch(){ try { localStorage.setItem("hndgmpWatch", JSON.stringify(WATCH)); } catch (e) {} }
function isWatched(d, dr, fn){ return WATCH.some(w => w.d === d && w.dir === dr && w.fn === fn); }
function dayHasWatch(d, dr){ return WATCH.some(w => w.d === d && w.dir === dr); }
function toggleWatch(d, dr, fn){
  if (isWatched(d, dr, fn)) WATCH = WATCH.filter(w => !(w.d === d && w.dir === dr && w.fn === fn));
  else { WATCH.push({d, dir: dr, fn}); WATCH.sort((a,b) => a.d < b.d ? -1 : (a.fn < b.fn ? -1 : 1)); }
  saveWatch();
}

// 日付をタップ→その日の全便(JAL以外も)から選んでウォッチするピッカー
function openDayPicker(iso){
  const fl = flightsOf(iso).slice().sort((a,b) => a.dep < b.dep ? -1 : 1);
  if (!fl.length) return;
  const ov = document.createElement("div");
  ov.className = "dpk-ov";
  const rows = fl.map(f => {
    const j = judge(f);
    const sym = j === 0 ? "○" : j === 1 ? "△" : "×";
    const on = isWatched(iso, dir, f.fn);
    const sb = f.sb && f.sb.Y !== undefined ? `・SB${f.sb.Y}` : "";
    return `<div class="dpk-row${on ? " on" : ""}" data-fn="${f.fn}">
      <span class="st">${on ? "★" : "☆"}</span><span class="sy s${j}">${sym}</span>
      ${alBadge(f.al)}<b>${f.fn}</b><span class="tm">${f.dep}</span>
      <span class="dv">Y${f.Y ?? "?"}${sb}</span></div>`;
  }).join("");
  ov.innerHTML = `<div class="dpk"><h3>${jd(iso)}${holidayBadge(iso)} の便をウォッチ</h3>
    <div class="dpk-sub">${dir.replace("-", " → ")} ／ 便をタップで登録・解除(★)。上部に大きく表示されます</div>
    ${rows}<button class="dpk-close">閉じる</button></div>`;
  const close = () => { ov.remove(); render(); };
  ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
  ov.querySelector(".dpk-close").addEventListener("click", close);
  ov.querySelectorAll(".dpk-row").forEach(r => r.addEventListener("click", () => {
    toggleWatch(iso, dir, r.dataset.fn);
    const on = isWatched(iso, dir, r.dataset.fn);
    r.classList.toggle("on", on);
    r.querySelector(".st").textContent = on ? "★" : "☆";
  }));
  document.body.appendChild(ov);
}

// 出発済み日の実績(サーバの最終観測値)。読み込みは起動時に1回
let ARCHIVE = [];
// ⑥リードタイム分析で選択中のJAL便
let ltFn = "";

function judge(f){
  const sb = f.sb && f.sb.Y !== undefined ? f.sb.Y : null;
  if (f.chance === "LOW") return 2;
  if (f.Y === null || f.Y === undefined) return 1;
  if (f.Y <= 2) return 2;
  if (f.chance === "MID") return 1;
  if (sb !== null && sb >= 10) return 1;
  if (f.Y === 9) return 0;
  return f.Y >= 5 ? 0 : 1;
}
const jd = d => { const t = new Date(d + "T00:00:00"); return d.slice(5).replace("-","/") + "(" + WD[t.getDay()] + ")"; };
const wdcls = d => { const g = new Date(d + "T00:00:00").getDay(); return g === 0 ? "sun" : g === 6 ? "sat" : ""; };

function latestDays(){ return DATA.latest.days; }
function dates(){ return Object.keys(latestDays()).filter(d => (latestDays()[d][dir]||[]).length).sort(); }
function flightsOf(d){ return (latestDays()[d][dir]||[]).filter(f => alOn[f.al]); }
function flightCols(){
  const m = new Map();
  for (const d of dates()) for (const f of flightsOf(d)) if (!m.has(f.fn)) m.set(f.fn, f);
  return [...m.values()].sort((a,b) => a.dep < b.dep ? -1 : 1);
}

function render(){
  if (!DATA) return;
  const ds = dates();
  const cols = flightCols();
  let h = "";

  // 搭乗券風ヘッダー
  const [o, t] = dir.split("-");

  h += `<div class="bp"><div class="bp-band"><span>ECONOMY SEAT MONITOR</span><span>NEXT ${ds.length} DAYS</span></div>
    <div class="bp-main">
      <div class="bp-ap"><b>${o}</b><span>${oName}</span></div>

      <div class="bp-ap right"><b>${t}</b><span>${tName}</span></div>

  // C8: 本日これから出る便(現在時刻以降)
  const tIso = todayIso();
  if (ds.includes(tIso)){

    if (remain.length){

      for (const f of remain){
        const j = judge(f);

        const sb = f.sb && f.sb.Y !== undefined ? `・SB${f.sb.Y}` : "";
        h += `<span class="tchip j${j}"><b>${sym}</b> ${alBadge(f.al)} ${f.fn} ${f.dep} <span class="tv">Y${f.Y ?? "?"}${sb}</span></span>`;

      h += `</div>`;

  // C7: ウォッチ中の便(カレンダーの日付タップ→便を選んで登録)
  if (WATCH.length){
    h += `<div class="wgrid">`;
    WATCH.forEach((w, wi) => {
      const f = ((latestDays()[w.d] || {})[w.dir] || []).find(x => x.fn === w.fn);
      const dleft = Math.round((new Date(w.d + "T00:00:00") - new Date(tIso + "T00:00:00")) / 864e5);
      const leftTxt = dleft === 0 ? "今日" : "あと" + dleft + "日";
      if (!f){
        h += `<div class="wcard"><button class="wdel" data-wi="${wi}">×</button><div class="wdate">${jd(w.d)} <span class="wleft">${leftTxt}</span></div><div class="wdir">${w.dir.replace("-"," → ")} ${alBadge(w.fn.slice(0,2))} ${w.fn}</div><div class="wnone">データなし(出発済み/欠航の可能性)</div></div>`;
        return;
      }
      const j = judge(f);
      const sym = j === 0 ? "○" : j === 1 ? "△" : "×";
      const sb = f.sb && f.sb.Y !== undefined ? `・SB${f.sb.Y}` : "";
      // この便のSB推移(直近5収集・JAL便のみデータあり)
      let sbTrend = "";
      const hist = DATA.snapshots.map(s => (((s.days[w.d] || {})[w.dir]) || []).find(x => x.fn === w.fn))
        .filter(x => x && x.sb && x.sb.Y !== undefined).map(x => x.sb.Y).slice(-5);
      if (hist.length >= 2) sbTrend = `<div class="wsb">SB推移: ${hist.join("→")}</div>`;
      h += `<div class="wcard wj${j}"><button class="wdel" data-wi="${wi}" title="ウォッチ解除">×</button>
        <div class="wdate">${jd(w.d)}${holidayBadge(w.d)} <span class="wleft">${leftTxt}</span></div>

        ${sbTrend}</div>`;

  // ① ヒートマップ
  h += `<div class="sec">① 日別 空席ヒートマップ(最新収集)</div><div class="card"><div class="heatwrap"><table class="heat"><thead><tr><th class="corner" style="text-align:left">日付</th>`;

  for (const d of ds){

    const fl = flightsOf(d);

    const ranked = fl.map(f => ({f, j: judge(f)})).sort((a,b) => a.j - b.j || ((a.f.sb?.Y ?? 99) - (b.f.sb?.Y ?? 99)));

  // ④ 収集履歴での変化
  h += `<div class="sec">④ 収集履歴での変化(スナップショット比較)</div><div class="card">

  if (!arch.length){

        const j = judge(f);
        const sb2 = f.sb && f.sb.Y !== undefined ? `<span class="sb">SB ${f.sb.Y}</span>` : `<span class="sb">&nbsp;</span>`;
        h += `<td><span class="cell j${j}"><span class="y">Y${f.Y ?? "?"}</span>${sb2}</span></td>`;

  }

  // ⑥ スタンバイの伸び方(リードタイム分析・JAL便)
  const jlFns = [...new Set(DATA.snapshots.flatMap(s =>
    Object.keys(s.days).flatMap(d2 => (((s.days[d2] || {})[dir]) || []).filter(f => f.al === "JL").map(f => f.fn))))].sort();
  if (jlFns.length){
    if (!jlFns.includes(ltFn)) ltFn = jlFns[0];
    h += `<div class="sec">⑥ スタンバイの伸び方(出発までの日数別・JAL便)</div><div class="card">
      <div class="ltseg">${jlFns.map(f2 => `<button class="ltbtn${f2 === ltFn ? " on" : ""}" data-fn="${f2}">${f2}</button>`).join("")}</div>
      ${leadChart(ltFn)}
      <div class="hint">横軸=出発までの日数(右端0=出発当日)。1本の線が1つの出発日。<b>色付き=これから出発する直近の日</b>・灰色=出発済み。収集が貯まるほど「何日前からどう伸びるか」のパターンが見え、直前予測に使えるようになります。</div></div>`;
  }

  document.getElementById("app").className = "";
  document.getElementById("app").innerHTML = h;
  const sel = document.getElementById("trendsel");
  if (sel){ sel.addEventListener("change", renderTrend); renderTrend(); }
  // C7: カレンダーのマス→便選択ピッカー、カードの×で解除
  document.querySelectorAll(".cday[data-d]").forEach(el =>
    el.addEventListener("click", () => openDayPicker(el.dataset.d)));
  document.querySelectorAll(".wdel").forEach(el =>
    el.addEventListener("click", (ev) => { ev.stopPropagation(); const w = WATCH[+el.dataset.wi]; if (w) { toggleWatch(w.d, w.dir, w.fn); render(); } }));
  // ③: 時間帯フィルタ切替(方向ごとに記憶)
  document.querySelectorAll(".todbtn").forEach(el =>
    el.addEventListener("click", () => { tod[dir] = el.dataset.tod; saveTod(); render(); }));
  // ⑥: 便切替
  document.querySelectorAll(".ltbtn").forEach(el =>
    el.addEventListener("click", () => { ltFn = el.dataset.fn; render(); }));
}

function sbChart(ds, jlCols){
  const colors = ["var(--red)", "var(--gold)", "var(--hover)", "var(--c-OZ)"];
  const W = Math.max(700, ds.length * 36 + 90), H = 232, L = 40, B = 36, T = 20;
  const maxSb = Math.max(10, ...ds.flatMap(d => flightsOf(d).filter(f => f.al === "JL").map(f => f.sb?.Y ?? 0)));
  const x = i => L + i * ((W - L - 16) / Math.max(1, ds.length - 1));
  const y = v => T + (H - T - B) * (1 - v / maxSb);
  let s = `<div class="tablewrap"><svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="JAL便スタンバイ数チャート">`;
  for (const g of [0, Math.round(maxSb/2), maxSb]){
    s += `<line class="axis" x1="${L}" y1="${y(g)}" x2="${W-16}" y2="${y(g)}"/><text class="tick" x="${L-6}" y="${y(g)+4}" text-anchor="end">${g}</text>`;
  }
  ds.forEach((d, i) => {
    const wd = new Date(d + "T00:00:00").getDay();
    s += `<text class="tick" x="${x(i)}" y="${H-18}" text-anchor="middle">${+d.slice(8)}</text>`;
    if (wd === 0 || wd === 6) s += `<text class="tick" x="${x(i)}" y="${H-4}" text-anchor="middle" fill="${wd === 0 ? "var(--red)" : "var(--hover)"}">${"日月火水木金土"[wd]}</text>`;
  });
  jlCols.forEach((c, ci) => {
    const col = colors[ci % colors.length];
    const pts = [];
    ds.forEach((d, i) => {
      const f = flightsOf(d).find(v => v.fn === c.fn);
      if (f && f.sb && f.sb.Y !== undefined) pts.push([x(i), y(f.sb.Y), f.sb.Y]);
    });
    if (!pts.length) return;
    s += `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`;
    for (const p of pts){
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${col}"/>`;
      if (p[2] > 0) s += `<text class="val" x="${p[0]}" y="${p[1]-8}" text-anchor="middle" fill="${col}">${p[2]}</text>`;
    }
  });
  s += `</svg></div><div class="chartlegend">` + jlCols.map((c, ci) =>
    `<span class="it"><span class="sw" style="background:${colors[ci % colors.length]}"></span>${c.fn} ${c.dep}発</span>`).join("") + `</div>
  <div class="hint">数字=スタンバイ登録人数(0の点は省略)。横にスクロールできます。</div>`;
  return s;
}

// ⑥ リードタイムチャート: 便fnについて「出発までの日数×SB」を出発日ごとの折れ線で描く
function leadChart(fn){
  const MAXLEAD = 7;   // 7日前からの推移を見る
  const byDate = new Map();   // 出発日 -> Map(lead -> {sb, ts})
  const put = (d2, lead, sb, ts) => {
    if (lead < 0 || lead > MAXLEAD) return;
    if (!byDate.has(d2)) byDate.set(d2, new Map());
    const m = byDate.get(d2);
    const cur = m.get(lead);
    if (!cur || ts > cur.ts) m.set(lead, {sb, ts});   // 同じリード日数は最新の観測を採用
  };
  const dayOf = (ts) => { const t = new Date(ts); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  for (const s of DATA.snapshots){
    const snapDay = dayOf(s.ts);
    for (const [d2, routes] of Object.entries(s.days)){
      const f = (((routes || {})[dir]) || []).find(x => x.fn === fn);
      if (!f || !f.sb || f.sb.Y === undefined) continue;
      put(d2, Math.round((new Date(d2 + "T00:00:00") - snapDay) / 864e5), f.sb.Y, s.ts);
    }
  }
  for (const a of ARCHIVE.filter(a => a.route === dir)){
    const f = (a.flights || []).find(x => x.fn === fn);
    if (!f || !f.sb || f.sb.Y === undefined) continue;
    put(a.date, Math.round((new Date(a.date + "T00:00:00") - dayOf(a.ts)) / 864e5), f.sb.Y, a.ts);
  }
  if (!byDate.size) return `<div class="hint">この便のスタンバイ観測はまだありません。</div>`;

  const t0 = todayIso();
  const past = [...byDate.keys()].filter(d2 => d2 < t0).sort();
  const upcoming = [...byDate.keys()].filter(d2 => d2 >= t0).sort().slice(0, 7);
  const allPts = [...byDate.values()].flatMap(m => [...m.values()].map(v => v.sb));
  const maxSb = Math.max(5, ...allPts);
  const W = 720, H = 232, L = 40, R = 18, T = 18, B = 34;
  const x = (lead) => L + (MAXLEAD - lead) * ((W - L - R) / MAXLEAD);
  const y = (v) => T + (H - T - B) * (1 - v / maxSb);
  let s = `<div class="tablewrap"><svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="スタンバイのリードタイム分析">`;
  for (const g of [0, Math.round(maxSb/2), maxSb])
    s += `<line class="axis" x1="${L}" y1="${y(g)}" x2="${W-R}" y2="${y(g)}"/><text class="tick" x="${L-6}" y="${y(g)+4}" text-anchor="end">${g}</text>`;
  for (let ld2 = MAXLEAD; ld2 >= 0; ld2 -= 1)
    s += `<text class="tick" x="${x(ld2)}" y="${H-16}" text-anchor="middle">${ld2 === 0 ? "当日" : ld2 + "日前"}</text>`;
  const series = (d2, color, wgt, withLabels) => {
    const pts = [...byDate.get(d2).entries()].sort((a, b) => b[0] - a[0]).map(([ld2, v]) => [x(ld2), y(v.sb), v.sb]);
    if (!pts.length) return "";
    let o = pts.length > 1
      ? `<polyline fill="none" stroke="${color}" stroke-width="${wgt}" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`
      : "";
    for (const p of pts){
      o += `<circle cx="${p[0]}" cy="${p[1]}" r="${withLabels ? 3.2 : 2.2}" fill="${color}"/>`;
      if (withLabels && p[2] > 0) o += `<text class="val" x="${p[0]}" y="${p[1]-8}" text-anchor="middle" fill="${color}">${p[2]}</text>`;
    }
    return o;
  };
  for (const d2 of past) s += series(d2, "color-mix(in srgb,var(--sub) 55%,transparent)", 1.5, false);
  const palette = ["var(--red)", "var(--hover)", "var(--gold)", "var(--c-OZ)", "var(--c-KE)", "var(--c-NH)", "var(--ok)"];
  upcoming.forEach((d2, i) => { s += series(d2, palette[i % palette.length], 2.5, true); });
  s += `</svg></div><div class="chartlegend">`
    + upcoming.map((d2, i) => `<span class="it"><span class="sw" style="background:${palette[i % palette.length]}"></span>${jd(d2)}発</span>`).join("")
    + (past.length ? `<span class="it"><span class="sw" style="background:color-mix(in srgb,var(--sub) 55%,transparent)"></span>出発済み ${past.length}日分</span>` : "")
    + `</div>`;
  return s;
}

function renderTrend(){
  const d = document.getElementById("trendsel").value;
  const allSnaps = DATA.snapshots;
  // この対象日+方向を実際に収集しているスナップショットだけを対象にする
  const relevant = allSnaps.filter(s => ((s.days[d]||{})[dir]||[]).length);
  const MAXCOL = 6;                                   // 表示する収集回は最新6回まで
  const hidden = Math.max(0, relevant.length - MAXCOL);
  const shown = relevant.slice(-MAXCOL);              // 最新の最大6回(古い→新しいの昇順)

  if (!shown.length){
    document.getElementById("trendwrap").innerHTML = `<div class="hint">この日の収集データはまだありません。</div>`;
    return;
  }

  // 便メタ(出発時刻・航空会社)を集め、出発順に並べる(表示中のスナップから)
  const meta = new Map();
  for (const s of shown) for (const f of ((s.days[d]||{})[dir]||[]))
    if (alOn[f.al] && !meta.has(f.fn)) meta.set(f.fn, {dep:f.dep, al:f.al});
  const fns = [...meta.keys()].sort((a,b) => meta.get(a).dep < meta.get(b).dep ? -1 : 1);

  // 当日(実日付)の収集を強調するための判定
  const dayKey = dt => dt.getFullYear() + "-" + (dt.getMonth()+1) + "-" + dt.getDate();
  const todayKey = dayKey(new Date());

  // 便の状態シグネチャ(Y・判定・SBが全て同じなら「変化なし」)
  const sig = f => f ? (f.Y + "|" + judge(f) + "|" + (f.sb && f.sb.Y !== undefined ? f.sb.Y : "")) : null;

  const older = hidden > 0
    ? `<div class="trendmore">← 古い収集 ほか${hidden}回は省略(最新${shown.length}回を表示)</div>`
    : "";

  let h = older + `<div class="tablewrap"><table><thead><tr><th style="text-align:left">便</th>`;
  for (const s of shown){
    const dt = new Date(s.ts);
    const cls = dayKey(dt) === todayKey ? "snap-today" : "snap-past";
    const md = (dt.getMonth()+1) + "/" + dt.getDate();
    const hm = String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
    h += `<th class="snap ${cls}"><span class="sd">${md}</span><span class="sh">${hm}</span></th>`;
  }
  h += `</tr></thead><tbody>`;

  for (const fn of fns){
    const al = meta.get(fn).al;
    h += `<tr><td class="dt">${alBadge(al)} <span class="fnl">${fn}</span><span class="tdep">${meta.get(fn).dep}</span></td>`;
    const states = shown.map(s => ((s.days[d]||{})[dir]||[]).find(x => x.fn === fn) || null);
    const allPresent = states.every(Boolean);
    const same = allPresent && states.every(f => sig(f) === sig(states[0]));
    if (shown.length >= 2 && same){
      // 表示期間中ずっと変化なし → 他と同じ見た目のチップ1つ+「変化なし」ピルに集約
      const f = states[0];
      const j = judge(f);
      const sb = f.sb && f.sb.Y !== undefined ? `<span class="sb ${f.sb.Y >= 10 ? "hot" : ""}">SB ${f.sb.Y}</span>` : `<span class="sb">&nbsp;</span>`;
      h += `<td colspan="${shown.length}" class="ncwrap"><span class="ncin"><span class="cell j${j} nc"><span class="y">Y${f.Y ?? "?"}</span>${sb}</span><span class="ncpill">変化なし</span></span></td>`;
    } else {
      let prev = null;
      for (const f of states){
        if (!f){ h += `<td><span class="cell">–</span></td>`; continue; }
        const j = judge(f);
        const changed = prev && sig(f) !== sig(prev);   // 前回の収集から動いたセルをリングで強調
        let sb = `<span class="sb">&nbsp;</span>`;
        if (f.sb && f.sb.Y !== undefined){
          let arrow = "";
          if (prev && prev.sb && prev.sb.Y !== undefined && f.sb.Y !== prev.sb.Y)
            arrow = f.sb.Y > prev.sb.Y ? `<span class="d-up">▲</span>` : `<span class="d-dn">▼</span>`;
          sb = `<span class="sb ${f.sb.Y >= 10 ? "hot" : ""}">SB ${f.sb.Y}${arrow}</span>`;
        }
        h += `<td><span class="cell j${j}${changed ? " chg" : ""}"><span class="y">Y${f.Y ?? "?"}</span>${sb}</span></td>`;
        prev = f;
      }
    }
    h += `</tr>`;
  }
  h += `</tbody></table></div>`;
  document.getElementById("trendwrap").innerHTML = h;
}

function buildPills(){
  const box = document.getElementById("alpills");
  box.innerHTML = "";
  for (const [code, a] of Object.entries(AL)){
    const b = document.createElement("button");
    b.className = "ally-pill" + (alOn[code] ? "" : " off");
    b.style.setProperty("--oc", a.c);
    b.innerHTML = `<span class="sw"></span><span class="nm">${code}</span><span class="ct">${a.name}</span>`;
    b.addEventListener("click", () => { alOn[code] = !alOn[code]; saveAlOn(); buildPills(); render(); });
    box.appendChild(b);
  }
}

document.getElementById("dir-hg").addEventListener("click", () => { dir = "HND-GMP"; syncDir(); });
document.getElementById("dir-gh").addEventListener("click", () => { dir = "GMP-HND"; syncDir(); });
function syncDir(){
  document.getElementById("dir-hg").classList.toggle("on", dir === "HND-GMP");
  document.getElementById("dir-gh").classList.toggle("on", dir === "GMP-HND");
  render();
}
document.getElementById("sharebtn").addEventListener("click", async () => {
  const url = location.href;
  try { if (navigator.share) await navigator.share({title: document.title, url}); else { await navigator.clipboard.writeText(url); alert("リンクをコピーしました"); } } catch(e){}
});

// データ読込: Supabase(自動収集分)と data.json(手動収集分)を併読して ts でマージ
const EF_URL = "https://xymbknvwllwhmqlexege.supabase.co/functions/v1/hnd-gmp-monitor";
Promise.allSettled([
  fetch(EF_URL).then(r => r.json()),
  fetch("./data.json", {cache: "no-cache"}).then(r => r.json()),
  fetch(EF_URL + "?view=archive").then(r => r.json()),
]).then(results => {
  if (results[2] && results[2].status === "fulfilled" && Array.isArray(results[2].value.archive)) {
    ARCHIVE = results[2].value.archive;
  }
  const sources = results
    .filter(r => r.status === "fulfilled" && r.value && r.value.latest && r.value.latest.days)
    .map(r => r.value);
  if (!sources.length) throw new Error("no data source");
  const byTs = new Map();
  for (const s of sources) for (const sn of (s.snapshots || [])) byTs.set(sn.ts, sn);
  const snapshots = [...byTs.values()].sort((a, b) => a.ts < b.ts ? -1 : 1);
  const latest = sources.map(s => s.latest).sort((a, b) => a.ts < b.ts ? 1 : -1)[0];
  const j = {latest, snapshots};
  DATA = j;
  renderHealth(j);
  document.getElementById("st-snap").textContent = j.snapshots.length;
  document.getElementById("st-days").textContent = Object.keys(j.latest.days).length;
  // 便/日: 当日は出発済み便が抜けるので、全日の中で最大の便数を「1日の便数」として出す
  const flMax = Math.max(0, ...Object.values(j.latest.days).map(r =>
    ((r["HND-GMP"]||[]).length + (r["GMP-HND"]||[]).length)));
  document.getElementById("st-fl").textContent = flMax || "–";
  buildPills();
  render();
}).catch(e => {
  document.getElementById("app").innerHTML = `<div class="loading">データの読み込みに失敗しました (${e})</div>`;
});
