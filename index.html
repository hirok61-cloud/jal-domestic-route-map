}}
:root[data-theme="light"]{
  --sea:#edf2f6; --land:#dce5ea; --coast:#b7c8d2; --ink:#17232f; --sub:#5b6c7a;
  --panel:#ffffff; --panel-edge:#d7e0e7; --hair:#e4eaef; --chipbg:#f2f6f9;
  --accent:#b8001f; --accent-soft:#fdeef0; --hover:#0d55a0;
  --c-JAL:#c8102e; --c-JAR:#e06a00; --c-JTA:#0077b6; --c-JAC:#2a8a4a;
  --c-RAC:#8a56c2; --c-HAC:#5b7f9e; --c-CS:#8b98a3;

}
:root[data-theme="dark"]{
  --sea:#0a1118; --land:#19242f; --coast:#2d3e4c; --ink:#e6edf3; --sub:#8fa1b0;
  --panel:#111a23; --panel-edge:#243240; --hair:#1e2b37; --chipbg:#19252f;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sea);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;
  font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit}
/* ---------- ヘッダー ---------- */
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;
  padding:14px 20px 10px;border-bottom:1px solid var(--hair)}
.titlebox h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:20px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.titlebox h1 .jp-red{color:var(--accent)}
.dateline{color:var(--sub);font-size:11.5px;letter-spacing:.05em}
.stats{margin-left:auto;display:flex;gap:8px}
.stat{background:var(--chipbg);border:1px solid var(--panel-edge);border-radius:10px;
  padding:4px 12px;text-align:center;line-height:1.25}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--sub);letter-spacing:.08em}
#sharebtn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-size:12.5px;
  font-weight:600;letter-spacing:.04em;box-shadow:var(--card-shadow);transition:transform .15s}
#sharebtn:hover{transform:translateY(-1px)}
#sharebtn:focus-visible{outline:2px solid var(--hover);outline-offset:2px}
/* ---------- 運航会社バー ---------- */
.opbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--hair);
  overflow-x:auto;scrollbar-width:thin}
.opbar .lbl{font-size:10.5px;color:var(--sub);letter-spacing:.14em;white-space:nowrap;flex:none}
.ops{display:flex;gap:6px;flex:none}
.op-pill{--oc:#888;display:inline-flex;align-items:center;gap:7px;flex:none;
  border:1.5px solid var(--panel-edge);background:var(--panel);border-radius:999px;
  padding:5px 13px 5px 9px;cursor:pointer;transition:all .18s;box-shadow:var(--card-shadow)}
.op-pill .sw{width:10px;height:10px;border-radius:50%;background:var(--oc);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--oc) 22%, transparent)}
.op-pill .code{font-weight:700;font-size:12.5px;letter-spacing:.02em}
.op-pill .nm{font-size:10px;color:var(--sub);max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-pill .ct{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.op-pill:hover{border-color:var(--oc)}
.op-pill.off{opacity:.38;filter:saturate(.2);box-shadow:none}
.op-pill:focus-visible{outline:2px solid var(--hover);outline-offset:2px}
.op-reset{flex:none;border:none;background:none;color:var(--hover);font-size:11.5px;cursor:pointer;
  white-space:nowrap;padding:4px 6px;border-radius:6px}
.op-reset:hover{text-decoration:underline}
.searchwrap{margin-left:auto;flex:none}
.searchwrap input{background:var(--chipbg);border:1px solid var(--panel-edge);border-radius:999px;
  padding:6px 14px;font-size:12px;color:var(--ink);width:180px;font-family:inherit}
.searchwrap input:focus-visible{outline:2px solid var(--hover);outline-offset:1px}
/* ---------- レイアウト ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:calc(100vh - 122px);min-height:520px}
#mapwrap{position:relative;overflow:hidden}
#mapwrap svg{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--hair);background:var(--panel);overflow-y:auto;padding:18px 20px 34px}
/* ---------- 地図 ---------- */
.route-line{fill:none;cursor:pointer;transition:opacity .15s,stroke-width .15s}
.route-line.dim{opacity:.08;pointer-events:none}
.route-line.seasonal-off{stroke-dasharray:5 4}
.route-hit{fill:none;stroke:transparent;stroke-width:15;cursor:pointer}
.route-hit.dim{pointer-events:none}
.airport-dot{cursor:pointer;stroke:var(--panel);stroke-width:1.3;transition:opacity .15s,r .15s}
.airport-dot.dim{opacity:.18}
.ap-label{font-size:9px;fill:var(--sub);pointer-events:none;
  paint-order:stroke;stroke:var(--sea);stroke-width:2.6px;stroke-linejoin:round;transition:opacity .15s}
.ap-label.major{font-size:10.5px;font-weight:600;fill:var(--ink)}
.ap-label.dim{opacity:.12}
#tooltip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--panel-edge);
  border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:5;max-width:260px}
#tooltip .t1{font-weight:700}
#tooltip .t2{color:var(--sub);font-size:11px}
.legend{position:absolute;left:12px;top:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);
  backdrop-filter:blur(4px);border:1px solid var(--panel-edge);border-radius:12px;
  padding:9px 13px;font-size:10.5px;line-height:1.8;box-shadow:var(--card-shadow)}
.legend .row{display:flex;align-items:center;gap:7px}
.legend .bar{width:18px;height:3px;border-radius:2px;flex:none}
.legend .bar.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
/* ---------- パネル共通 ---------- */
aside h2{font-size:17px;margin:0 0 2px;letter-spacing:.02em}
aside .sub{color:var(--sub);font-size:12px}
.acode{color:var(--sub);font-size:11px;font-weight:400}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:12px 0;
  padding:10px 14px;background:var(--chipbg);border-radius:12px;font-size:12px}
.facts b{font-size:15px}
.opchip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:10.5px;color:#fff;
  background:var(--oc,#888);letter-spacing:.03em;font-weight:600}
.backlink{display:inline-flex;align-items:center;gap:4px;margin-bottom:10px;font-size:12px;

  padding:5px 12px;border-radius:999px}
.backlink:hover{border-color:var(--hover)}
.note{margin:10px 0;padding:9px 13px;border-left:3px solid var(--accent);background:var(--chipbg);
  border-radius:0 10px 10px 0;font-size:12px}
.note.season{border-left-color:var(--c-CS)}
.sec{margin:22px 0 8px;font-size:11px;color:var(--sub);letter-spacing:.16em;font-weight:600}
.hint{color:var(--sub);font-size:12px;margin-top:12px}
.fade{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* 時刻表 */
.dirhead{margin:20px 0 6px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.dirhead .arr{color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;color:var(--sub);text-align:left;font-weight:600;letter-spacing:.08em;

td{padding:6px 8px;border-bottom:1px solid var(--hair);white-space:nowrap}
td.fno{font-weight:700}
tr.flight:hover td{background:var(--chipbg)}
.acbtn{background:none;border:none;color:var(--hover);cursor:pointer;font-size:12.5px;padding:0}
.acbtn:hover{text-decoration:underline}

.rtlist{list-style:none;margin:8px 0;padding:0}

  border-bottom:1px solid var(--hair);cursor:pointer;border-radius:10px;transition:background .12s}
.rtlist li:hover{background:var(--chipbg)}
.rtlist .dest{font-weight:600;flex:1;min-width:0}
.rtlist .meta{color:var(--sub);font-size:11px;white-space:nowrap}
/* 空港ショートカット・機材カード */
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:8px 0}
.hub{border:1px solid var(--panel-edge);background:var(--panel);border-radius:12px;padding:9px 6px 7px;
  cursor:pointer;text-align:center;box-shadow:var(--card-shadow);transition:transform .15s,border-color .15s}
.hub:hover{transform:translateY(-2px);border-color:var(--accent)}
.hub b{display:block;font-size:12.5px}
.hub span{font-size:10px;color:var(--sub)}
.acgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.accard{border:1px solid var(--panel-edge);background:var(--panel);border-radius:12px;
  padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--card-shadow);
  transition:transform .15s,border-color .15s;line-height:1.45}
.accard:hover{transform:translateY(-2px);border-color:var(--accent)}
.accard .cd{font-weight:700;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.accard .nm{font-size:10.5px;color:var(--sub);display:block}
.accard .ct{font-size:10.5px;color:var(--accent);font-weight:600}
.accard.sel{border-color:var(--accent);background:var(--accent-soft)}
.hub:focus-visible,.accard:focus-visible{outline:2px solid var(--hover);outline-offset:2px}
/* トースト */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);
  color:var(--sea);padding:9px 20px;border-radius:999px;font-size:12.5px;opacity:0;
  pointer-events:none;transition:all .3s;z-index:50;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{padding:10px 20px 16px;color:var(--sub);font-size:11px;border-top:1px solid var(--hair);line-height:1.7}
footer a{color:var(--hover)}
/* ---------- モバイル ---------- */
@media (max-width:900px){
  header{padding:12px 14px 8px;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start}
  .titlebox{min-width:0}
  .titlebox h1{font-size:16.5px}
  .stats{display:none}
  #sharebtn{flex:none;padding:7px 13px}
  .opbar{padding:8px 12px}
  .searchwrap{margin-left:4px}
  .searchwrap input{width:150px}
  main{grid-template-columns:1fr;height:auto;min-height:0}
  #mapwrap{height:56vh;min-height:340px}
  aside{border-left:none;border-top:1px solid var(--hair)}
  .legend{display:none}
  .acgrid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

function hav(a,b){const R=6371,d=Math.PI/180;
 const x1=AP[a][1]*d,y1=AP[a][2]*d,x2=AP[b][1]*d,y2=AP[b][2]*d;
 const h=Math.sin((y2-y1)/2)**2+Math.cos(y1)*Math.cos(y2)*Math.sin((x2-x1)/2)**2;
 return Math.round(2*R*Math.asin(Math.sqrt(h)));}
const t2m = t => +t.slice(0,2)*60 + +t.slice(3,5);
const m2t = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const fmtDur = m => (m>=60? Math.floor(m/60)+"時間" : "") + (m%60? (m%60)+"分" : "");
function flightsFor(r,dir){
 const first=t2m(dir? r.rf : r.of), last=t2m(dir? r.rl : r.ol), blk=dir? r.br : r.bo;
 const out=[];
 for(let i=0;i<r.n;i++){
  let dep = r.n===1? first : first + Math.round((last-first)*i/(r.n-1)/5)*5;
  dep += (i>0&&i<r.n-1)? ((i*37)%3-1)*5 : 0;
  const op = r.ops[i%r.ops.length], ac = r.ac[i%r.ac.length];
  const num = r.f + (dir?1:0) + 2*i;
  out.push({no:OPS[op][2]+String(num).padStart(OPS[op][2]==="JL"?0:3,"0"),op,ac,dep:m2t(dep),arr:m2t(dep+blk)});
 }
 return out;
}

function routePath(r){
 const x1=PX(AP[r.a][1]),y1=PY(AP[r.a][2]),x2=PX(AP[r.b][1]),y2=PY(AP[r.b][2]);
 const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
 return `M${x1} ${y1}Q${mx-dy*.12} ${my+dx*.12} ${x2} ${y2}`;
}

 dot.addEventListener("click",()=>selectAirport(code));
 dot.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectAirport(code);}});
 dot.addEventListener("mousemove",e=>showTip(e,`<div class="t1">${name} <span class="acode">${code}</span></div><div class="t2">${deg}路線が発着 — クリックで路線一覧</div>`));
 dot.addEventListener("mouseleave",hideTip);
});
/* 選択路線上を飛ぶ飛行機マーカー */
let planeEl=null;
function flyPlane(i){
 if(planeEl){planeEl.remove();planeEl=null;}
 if(i==null||REDUCED)return;
 const d=routeEls[i].getAttribute("d");
 planeEl=el("g",{},gFx);
 el("circle",{r:4.2,fill:"var(--accent)",stroke:"var(--panel)","stroke-width":1.5},planeEl);
 const am=el("animateMotion",{dur:"5s",repeatCount:"indefinite",path:d,rotate:"auto"},planeEl);
 am.beginElement&&am.beginElement();
}
/* ============ 表示状態 ============ */
function routeVisible(r){
 return r.ops.some(o=>state.ops[o]) && (!state.selAc || r.ac.includes(state.selAc));
}
function applyDim(){
 const {sel,selAp}=state;
 ROUTES.forEach((r,i)=>{
  let vis = routeVisible(r);
  if(vis && sel!=null) vis = i===sel;
  else if(vis && selAp) vis = r.a===selAp||r.b===selAp;
  routeEls[i].classList.toggle("dim",!vis);
  hitEls[i].classList.toggle("dim",!vis);
  routeEls[i].setAttribute("opacity", i===sel?1:.6);
  routeEls[i].setAttribute("stroke-width", i===sel?(baseW(ROUTES[i])*2).toFixed(2):baseW(ROUTES[i]).toFixed(2));
 });
 document.querySelectorAll(".airport-dot,.ap-label").forEach(n=>{
  const code=n.getAttribute("data-ap");
  let vis;
  if(sel!=null) vis = ROUTES[sel].a===code||ROUTES[sel].b===code;
  else if(selAp) vis = code===selAp || (apRoutes[code]||[]).some(i=>{const r=ROUTES[i];return (r.a===selAp||r.b===selAp)&&routeVisible(r);});
  else vis = (apRoutes[code]||[]).some(i=>routeVisible(ROUTES[i]));
  n.classList.toggle("dim",!vis);
 });
}
const opChipHTML = o => `<span class="opchip" style="--oc:var(${OPCOLOR[o]})">${OPS[o][0]}</span>`;
function flightTableHTML(r,dir){
 const list=flightsFor(r,dir);
 return `<div class="tablewrap"><table><thead><tr><th>便名</th><th>出発 → 到着</th><th>機材</th><th>運航</th></tr></thead><tbody>`+
 list.map(f=>`<tr class="flight"><td class="fno mono">${f.no}</td><td class="mono">${f.dep} → ${f.arr}</td><td><button class="acbtn" data-ac="${f.ac}" title="${AC[f.ac][0]}の路線を見る">${ACSHORT[f.ac]}</button></td><td>${OPS[f.op][0]}</td></tr>`).join("")+`</tbody></table></div>`;
}
function bindAcButtons(scope){
 scope.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>selectAircraft(b.dataset.ac));
}
/* ============ パネル ============ */
const panel=document.getElementById("panel");
function setPanel(html){panel.innerHTML=`<div class="fade">${html}</div>`;panel.scrollTop=0;}
function scrollToPanel(){
 if(innerWidth>900) return;
 setTimeout(()=>panel.scrollIntoView({block:"start"}),30);
}
function backBtn(){return `<button class="backlink" id="back">← 全体マップに戻る</button>`;}
function bindBack(){const b=document.getElementById("back");if(b)b.onclick=clearSel;}
function routeListItems(list,ctx){ // ctx: "ap"|"ac"
 return list.map(i=>{const r=ROUTES[i];
  const dest = ctx==="ap"? AP[r.a===state.selAp?r.b:r.a][0] : `${AP[r.a][0]} ⇄ ${AP[r.b][0]}`;
  return `<li data-i="${i}"><span class="dest">${dest}</span>${[...new Set(r.ops)].map(opChipHTML).join("")}<span class="meta mono">${r.n}往復${r.season?"・季節":""}</span></li>`;}).join("");
}
function bindRouteList(){panel.querySelectorAll("li[data-i]").forEach(li=>li.onclick=()=>selectRoute(+li.dataset.i));}

function selectRoute(i){
 state.sel=i; state.selAp=null; applyDim(); flyPlane(i);
 const r=ROUTES[i], km=hav(r.a,r.b);
 const ops=[...new Set(r.ops)], acs=[...new Set(r.ac)];
 setPanel(`${backBtn()}
  <h2>${AP[r.a][0]} ⇄ ${AP[r.b][0]}</h2>
  <div class="sub">${ops.map(o=>OPS[o][1]).join("・")}</div>
  <div class="facts">
   <span><b>${r.n}</b> 往復/日</span><span>約<b>${km.toLocaleString()}</b> km</span>
   <span>所要 <b>${fmtDur(r.bo)}</b>前後</span><span>${ops.map(opChipHTML).join(" ")}</span>
  </div>
  ${r.season? `<div class="note season">季節運航（${r.season.txt}）${r.season.active? "・現在運航中":"・<b>7月11日時点は運航期間外</b>"}</div>`:""}
  ${r.note? `<div class="note">${r.note}</div>`:""}
  <div class="dirhead">${AP[r.a][0]} <span class="arr">→</span> ${AP[r.b][0]}</div>${flightTableHTML(r,0)}
  <div class="dirhead">${AP[r.b][0]} <span class="arr">→</span> ${AP[r.a][0]}</div>${flightTableHTML(r,1)}
  <p class="hint">機材名をタップすると、その機材が飛ぶ路線マップに切り替わります。<br>使用機材: ${acs.map(a=>`${AC[a][0]}（${AC[a][1]}）`).join("／")}</p>`);
 bindBack(); bindAcButtons(panel); scrollToPanel();
}
function selectAirport(code){
 state.selAp=code; state.sel=null; applyDim(); flyPlane(null);
 const list=(apRoutes[code]||[]).filter(i=>routeVisible(ROUTES[i])).sort((x,y)=>ROUTES[y].n-ROUTES[x].n);
 const total=list.reduce((s,i)=>s+ROUTES[i].n,0);
 setPanel(`${backBtn()}
  <h2>${AP[code][0]} <span class="acode">${code}</span></h2>
  <div class="facts"><span><b>${list.length}</b> 路線</span><span><b>${total*2}</b> 便/日（往復合計）</span></div>
  <ul class="rtlist">${routeListItems(list,"ap")}</ul>
  <p class="hint">行き先をタップすると全便の時刻・機材が表示されます。</p>`);
 bindBack(); bindRouteList(); scrollToPanel();
}
function selectAircraft(ac){
 if(state.selAc===ac && state.sel==null && state.selAp==null){state.selAc=null;return clearSel();}
 state.selAc=ac; state.sel=null; state.selAp=null; applyDim(); flyPlane(null);
 const list=ROUTES.map((r,i)=>i).filter(i=>ROUTES[i].ac.includes(ac)&&ROUTES[i].ops.some(o=>state.ops[o]))
  .sort((x,y)=>ROUTES[y].n-ROUTES[x].n);
 const daily=list.reduce((s,i)=>{const r=ROUTES[i];
  return s + [0,1].reduce((t,d)=>t+flightsFor(r,d).filter(f=>f.ac===ac).length,0);},0);
 scrollToPanel();
 setPanel(`<button class="backlink" id="back">← 機材の絞り込みを解除</button>
  <h2>${AC[ac][0]} <span class="acode mono">${ACSHORT[ac]}</span></h2>
  <div class="sub">${AC[ac][1]}</div>
  <div class="facts"><span><b>${list.length}</b> 路線で運航</span><span>約<b>${daily}</b> 便/日</span></div>
  <div class="note season">地図にはこの機材が投入されている路線だけを表示しています。</div>
  <ul class="rtlist">${routeListItems(list,"ac")}</ul>
  <p class="hint">※機材の割り当ては代表的なパターンによる参考情報です。</p>`);
 document.getElementById("back").onclick=()=>{state.selAc=null;clearSel();};
 bindRouteList();
}
function clearSel(){state.sel=null;state.selAp=null;applyDim();flyPlane(null);renderHome();}
function renderHome(){
 const hubs=["HND","ITM","OKA","FUK","CTS","KOJ","OKD","ISG"];
 const acCount=Object.fromEntries(Object.keys(AC).map(a=>[a,ROUTES.filter(r=>r.ac.includes(a)).length]));
 setPanel(`
  <h2>路線をさがす</h2>
  <div class="sub">地図の路線・空港をタップ、または下のショートカットからどうぞ。</div>
  <div class="note">2026年7月11日（土）時点の夏ダイヤをもとにした<b>参考データ</b>です。破線＝季節運航（7/17〜8/31の路線は現在期間外）。羽田=石垣・宮古線は7/17から787-8に大型化。</div>
  <div class="sec">主要空港から探す</div>
  <div class="hubgrid">${hubs.map(h=>`<button class="hub" data-hub="${h}" aria-label="${AP[h][0]}の路線一覧を表示"><b>${AP[h][0]}</b><span>${(apRoutes[h]||[]).length}路線</span></button>`).join("")}</div>
  <div class="sec">機材から探す</div>
  <div class="acgrid">${Object.keys(AC).map(a=>`
   <button class="accard${state.selAc===a?" sel":""}" data-ac="${a}" aria-label="${AC[a][0]}が飛ぶ路線を表示" aria-pressed="${state.selAc===a}">
    <span class="cd">${ACSHORT[a]}</span> <span class="ct">${acCount[a]}路線</span>
    <span class="nm">${AC[a][0]}・${AC[a][1]}</span>
   </button>`).join("")}</div>
  <p class="hint">上部のバーで運航会社の表示切替、検索ボックスで空港ジャンプができます。</p>`);
 panel.querySelectorAll("[data-hub]").forEach(b=>b.onclick=()=>selectAirport(b.dataset.hub));
 bindAcButtons(panel);
}
/* ============ 運航会社バー・凡例・検索・共有 ============ */
const opsBox=document.getElementById("ops");
const opRouteCount = o => ROUTES.filter(r=>r.ops.includes(o)).length;
Object.keys(OPS).forEach(o=>{
 const b=document.createElement("button");
 b.className="op-pill"; b.style.setProperty("--oc",`var(${OPCOLOR[o]})`);
 b.setAttribute("aria-pressed","true"); b.title=OPS[o][1];
 b.innerHTML=`<span class="sw"></span><span class="code">${OPS[o][0]}</span><span class="nm">${OPS[o][1].replace(/\(共同運航\)/,"")}</span><span class="ct">${opRouteCount(o)}</span>`;
 b.onclick=()=>{state.ops[o]=!state.ops[o];
  b.classList.toggle("off",!state.ops[o]); b.setAttribute("aria-pressed",String(state.ops[o]));
  refreshAfterFilter();};
 opsBox.appendChild(b);
});
document.getElementById("opreset").onclick=()=>{
 Object.keys(state.ops).forEach(o=>state.ops[o]=true);
 opsBox.querySelectorAll(".op-pill").forEach(b=>{b.classList.remove("off");b.setAttribute("aria-pressed","true");});
 refreshAfterFilter();
};
function refreshAfterFilter(){
 if(state.sel!=null && !routeVisible(ROUTES[state.sel])) return clearSel();
 applyDim();
 if(state.selAp) selectAirport(state.selAp);
 else if(state.selAc) selectAircraft(state.selAc);
 else if(state.sel==null) renderHome();
}
document.getElementById("legend").innerHTML =
 Object.keys(OPCOLOR).filter(o=>!["SFJ","AMX"].includes(o)).map(o=>
  `<div class="row"><span class="bar" style="background:var(${OPCOLOR[o]})"></span>${OPS[o][0]} <span style="color:var(--sub)">${OPS[o][1]}</span></div>`).join("")+
 `<div class="row"><span class="bar" style="background:var(--c-CS)"></span>コードシェア（SFJ・AMX）</div>
  <div class="row"><span class="bar dash" style="color:var(--sub)"></span>季節運航</div>
  <div class="row" style="color:var(--sub)">太さ＝便数／丸＝路線数</div>`;
const dl=document.getElementById("aplist");
Object.values(AP).forEach(([n])=>{const o=document.createElement("option");o.value=n;dl.appendChild(o);});
document.getElementById("apsearch").addEventListener("change",e=>{
 const q=e.target.value.trim(); if(!q)return;
 const hit=Object.entries(AP).find(([c,[n]])=>n===q)||Object.entries(AP).find(([c,[n]])=>n.includes(q));
 if(hit)selectAirport(hit[0]); e.target.value="";
});
const toast=document.getElementById("toast");
let toastTimer=null;
function showToast(msg){toast.textContent=msg;toast.classList.add("show");
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2400);}
document.getElementById("sharebtn").onclick=async()=>{
 try{
  if(navigator.share){await navigator.share({title:document.title,url:SHARE_URL});return;}
  await navigator.clipboard.writeText(SHARE_URL);
  showToast("リンクをコピーしました ✈");
 }catch(err){
  if(err&&err.name==="AbortError")return;
  try{const ta=document.createElement("textarea");ta.value=SHARE_URL;document.body.appendChild(ta);
   ta.select();document.execCommand("copy");ta.remove();showToast("リンクをコピーしました ✈");}
  catch(e2){showToast(SHARE_URL);}
 }
};
/* 統計 */
document.getElementById("st-ap").textContent=Object.keys(AP).length;
document.getElementById("st-rt").textContent=ROUTES.length;
document.getElementById("st-fl").textContent=ROUTES.reduce((s,r)=>s+(r.season&&!r.season.active?0:r.n),0)*2;
applyDim(); renderHome();
</script>

</body>
</html>
